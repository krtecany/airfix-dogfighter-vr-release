; gtVR settings
[render]
; 11 = own Direct3D 11 renderer (window, Alt+Tab works)
;  7 = original gtDirect3D renderer (exclusive full screen), only logged
Renderer=11
; window size = game resolution x WindowScale (1-4)
WindowScale=2

[vr]
; 1 = use SteamVR when it is running and a headset is connected (needs openvr_api.dll), 0 = monitor only
Enable=1
; game units per real metre: scales head movement and eye distance
; (NumPad +/- in game changes and saves it, NumPad 5 recentres)
WorldScale=2.44
; 1 = lock the game time to the headset frames (smooth motion; game runs ~1 % slower), 0 = original timing
FrameLock=1
; chase camera follows turns smoothly (seconds, 0 = off; NumPad 7 toggles in game)
CameraSmoothing=0.25
; distance of the pivot (the plane) in front of the camera, game units
CameraPivot=0.9
; 1 = Quest controllers as a joystick for the game (+ menu cursor), 0 = keyboard/mouse only
Controllers=1
; menus: the right controller points at the screen like a laser; tilt of the ray in degrees (+ = lower)
PointerTilt=44
; virtual screen for the menus: distance and width in metres
ScreenDistance=1.6
ScreenWidth=1.8
; height of the screen centre relative to the eyes (metres, negative = lower)
ScreenHeight=-0.15
; HUD during flight: panel width in metres (in front of you like the menu screen)
HudWidth=1.3
; HUD panel centre height relative to the eyes (metres, negative = lower)
HudHeight=-0.4
; weapon sights: drawn in 3D on the game camera, distance in metres, focal (deg) and size factor
HudDistance=20
HudFov=50
SightScale=0.75

[debug]
; 1 = write detailed diagnostics into gtVR.log (for bug reports)
Verbose=0
